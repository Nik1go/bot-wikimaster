services:
  wiki-bot:
    build: .
    init: true
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 30s
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - browser-data:/data
    ports:
      - "127.0.0.1:6080:6080"
    security_opt:
      - seccomp=./docker/seccomp_profile.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  browser-data:
