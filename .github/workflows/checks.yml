name: Checks
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: cp .env.example .env
      - run: bash -n docker/entrypoint.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.collection.yaml config --quiet
      - run: node scripts/check-compose.mjs
      - run: docker compose build
      - name: Collection lock lifecycle without an account
        run: docker compose run --rm --entrypoint node wiki-bot scripts/collection-lifecycle-check.mjs
      - name: Offline comparison without a desktop
        run: docker compose run --rm -e DISPLAY=invalid wiki-bot market-compare --demo
      - run: docker compose run --rm wiki-bot smoke
      - name: Collection browser check on a local fixture
        run: docker compose run --rm --entrypoint node wiki-bot scripts/collection-browser-check.mjs
      - run: docker compose run --rm wiki-bot manual-smoke
